name: Kernel Builder
env:
  TZ: Asia/Shanghai
  CPU: 'MT6895'
  FEIL: 'XiaoMi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.1'
  KERNEL_NAME: 'ShirokoNeko-V8Pro-goodfan-full'
  KERNELSU_VARIANT: 'SukiSU-Ultra'
  KERNELSU_BRANCH: 'susfs-main'

on:
  workflow_dispatch:

jobs:
  xinran:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码并初始化子模块
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      
      - name: 释放磁盘空间
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq curl
          curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash

      - name: 设置交换空间
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 8
  
      - name: 设置ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 7.5G

      - name: 缓存工具链
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: /opt/toolchain
          key: ${{ runner.os }}-toolchain
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: 安装依赖并获取工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq \
            bc bison ccache curl flex git tar wget lz4 unzip lld -y
          
          mkdir -p /opt/toolchain

          # build-tools
          git clone --depth 1 -b main-kernel-build-2024 \
            https://android.googlesource.com/kernel/prebuilts/build-tools \
            /opt/toolchain/build-tools

          # mkbootimg
          git clone --depth 1 -b main-kernel-build-2024 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            /opt/toolchain/mkbootimg

          # clang
          wget -qO clang.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
          mkdir -p /opt/toolchain/clang
          tar -xzf clang.tar.gz -C /opt/toolchain/clang
          rm clang.tar.gz

      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "正在克隆源码仓库..."
          git clone --depth=1 https://github.com/Winkmoon/android_gki_kernel_5.10_common-esk-ShirokoNeko -b esk

      - name: 添加 SukiSU-Ultra
        id: ksu_version
        run: |
          cd kernel_workspace
          # 安装 SukiSU-Ultra
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s susfs-main
          
          # 计算 KSU 版本
          cd KernelSU
          KSU_VERSION=$(expr $(git rev-list --count main) "+" 10700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          
          # 更新 Makefile
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=$KSU_VERSION/" kernel/Makefile
          
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          # 删除 ABI 保护文件（如果存在）
          rm -f abi_gki_protected_exports_* || true
          
          # 修改 setlocalversion 脚本
          for f in ../../scripts/setlocalversion; do
            if [ -f "$f" ]; then
              sed -i 's/ -dirty//g' "$f"
              sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
            fi
          done

      - name: 添加配置设置
        run: |
          cd kernel_workspace
          # 添加 KernelSU 配置
          echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPM=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./common/arch/arm64/configs/gki_defconfig
          
          # 禁用 defconfig 检查
          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: 设置内核版本后缀
        run: |
          cd kernel_workspace
          echo "设置内核版本后缀为：${{ env.KERNEL_NAME }}"
          
          # 直接修改 setlocalversion 脚本
          if [ -f "./scripts/setlocalversion" ]; then
            sed -i "\$s|echo \"\\\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" ./scripts/setlocalversion
          else
            echo "错误: setlocalversion 文件未找到!"
            exit 1
          fi

      - name: 应用额外补丁
        run: |
          cd kernel_workspace
          
          # 应用 multi-manager 补丁
          echo "Applying multi-manager patch"
          cd KernelSU
          wget -qO - https://raw.githubusercontent.com/bachnxuan/kernel_patches/refs/heads/master/next_manager.patch | patch -p1 --forward --fuzz=3
          cd ..
      
          # 应用 LXC 补丁
          echo "应用 LXC 补丁"
          wget -qO - https://raw.githubusercontent.com/bachnxuan/kernel_patches/master/lxc.patch | patch -p1 --forward --fuzz=3

      - name: 构建内核
        run: |
          cd kernel_workspace
          
          # 设置环境变量
          export USE_CCACHE=1
          export PATH=/opt/toolchain/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export LLVM=1 
          export LLVM_IAS=1
          export LD=/opt/toolchain/clang/bin/ld.lld
          export AR=/opt/toolchain/clang/bin/llvm-ar
          export NM=/opt/toolchain/clang/bin/llvm-nm
          export OBJCOPY=/opt/toolchain/clang/bin/llvm-objcopy
          export OBJDUMP=/opt/toolchain/clang/bin/llvm-objdump
          export STRIP=/opt/toolchain/clang/bin/llvm-strip
          export KBUILD_BUILD_USER=ShirokoNeko_build

          # 构建内核
          make -j$(nproc) CC="ccache clang" CXX="ccache clang++" esk_defconfig O=out
          make -j$(nproc) CC="ccache clang" CXX="ccache clang++" \
            CONFIG_LTO_CLANG_THIN=y CONFIG_LTO_CLANG_FULL=n O=out

      - name: 获取提交SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: 打包AnyKernel3
        run: |
          cd kernel_workspace
          
          # 克隆并准备 AnyKernel3
          git clone https://github.com/bachnxuan/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git .github
          
          # 复制内核镜像
          cp ../out/arch/arm64/boot/Image.gz .
          
          # 创建ZIP包
          zip -r "../android12-5.10.X-lts-${SHORT_SHA}-xinran-AnyKernel3.zip" .

      - name: 构建boot镜像
        run: |
          cd kernel_workspace
          
          # 创建临时目录
          mkdir boot
          cd boot
          
          # 下载并解压GKI镜像
          GKI_URL="https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2025-02_r1.zip"
          curl -sL "$GKI_URL" -o gki.zip
          unzip gki.zip
          
          # 解包boot镜像
          python3 /opt/toolchain/mkbootimg/unpack_bootimg.py --boot_img=$(pwd)/boot-5.10.img
          
          # 复制新内核
          cp ../out/arch/arm64/boot/Image.gz .
          
          # 重新打包boot镜像
          python3 /opt/toolchain/mkbootimg/mkbootimg.py \
            --header_version 4 \
            --kernel Image.gz \
            --output boot.img \
            --ramdisk out/ramdisk \
            --os_version 12.0.0 \
            --os_patch_level 2025-02
          
          # 重命名并移动boot镜像
          mv boot.img "../android12-5.10.X-lts-${SHORT_SHA}-xinran-boot.img"

      - name: 上传最终产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-xinran
          path: |
            kernel_workspace/android12-5.10.X-lts-${{ env.SHORT_SHA }}-xinran-AnyKernel3.zip
            kernel_workspace/android12-5.10.X-lts-${{ env.SHORT_SHA }}-xinran-boot.img
